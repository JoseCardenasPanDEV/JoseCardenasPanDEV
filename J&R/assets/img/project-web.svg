<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#webBg)"/>

  <!-- Web Browser Mockup Frame -->
  <g transform="translate(45, 80)">
    <rect width="510" height="235" rx="14" fill="#0d1424" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <rect width="510" height="34" rx="14" fill="#141e33"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="38" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="17" r="5" fill="#10b981"/>
    
    <!-- URL search bar -->
    <rect x="85" y="8" width="340" height="18" rx="6" fill="#090d16"/>
    <text x="95" y="21" font-family="monospace" font-size="10" fill="#94a3b8">https://apex-platform.enterprise.app/dashboard</text>

    <!-- Browser Content Grid -->
    <g transform="translate(20, 50)">
      <!-- Sidebar -->
      <rect x="0" y="0" width="90" height="150" rx="8" fill="#17223b"/>
      <rect x="12" y="15" width="66" height="8" rx="3" fill="#38bdf8"/>
      <rect x="12" y="32" width="55" height="6" rx="3" fill="#64748b"/>
      <rect x="12" y="46" width="60" height="6" rx="3" fill="#64748b"/>
      <rect x="12" y="60" width="50" height="6" rx="3" fill="#64748b"/>

      <!-- Main Dashboard Cards -->
      <rect x="105" y="0" width="175" height="70" rx="8" fill="#1e293b" stroke="rgba(99, 102, 241, 0.3)"/>
      <text x="120" y="25" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#818cf8">React 18 Microfrontend</text>
      <text x="120" y="45" font-family="monospace" font-size="10" fill="#cbd5e1">Virtual DOM • State Ops</text>

      <rect x="295" y="0" width="175" height="70" rx="8" fill="#1e293b" stroke="rgba(239, 68, 68, 0.3)"/>
      <text x="310" y="25" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#f87171">Angular SPA Module</text>
      <text x="310" y="45" font-family="monospace" font-size="10" fill="#cbd5e1">RxJS • Dependency Inject</text>

      <!-- Multi-language backend integration bar -->
      <rect x="105" y="82" width="365" height="68" rx="8" fill="#111c33" stroke="rgba(16, 185, 129, 0.3)"/>
      <text x="120" y="105" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#34d399">Multi-Language Backend Services</text>
      <text x="120" y="128" font-family="monospace" font-size="11" fill="#94a3b8">C# (.NET Core) | Java (Spring Boot) | Python (FastAPI)</text>
    </g>
  </g>

  <text x="30" y="45" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#ffffff">APEX ENTERPRISE SAAS PLATFORM</text>
  <text x="30" y="65" font-family="monospace" font-size="12" fill="#38bdf8">Fullstack Web App (React / Angular / JavaScript / C# / Java / Python)</text>
</svg>

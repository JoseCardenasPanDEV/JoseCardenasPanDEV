<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="langchainColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#ragBg)"/>

  <!-- Pipeline Layers -->
  <g transform="translate(40, 100)">
    <!-- Document Ingestion -->
    <rect x="0" y="20" width="100" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="50" y="65" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#ffffff">Document</text>
    <text x="50" y="85" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">Chunks</text>

    <!-- Arrow 1 -->
    <path d="M110 75 L145 75" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Embeddings & Langchain Core -->
    <rect x="155" y="0" width="140" height="150" rx="16" fill="#0f172a" stroke="url(#langchainColor)" stroke-width="2"/>
    <text x="225" y="40" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="15" fill="#10b981">LangChain</text>
    <text x="225" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">Embedding Engine</text>
    <line x1="175" y1="80" x2="275" y2="80" stroke="rgba(255,255,255,0.1)"/>
    <text x="225" y="105" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" fill="#ffffff">Memory Agent</text>
    <text x="225" y="125" text-anchor="middle" font-family="monospace" font-size="10" fill="#06b6d4">ConversationBuffer</text>

    <!-- Arrow 2 -->
    <path d="M305 75 L340 75" stroke="#64748b" stroke-width="2"/>

    <!-- Vector DB (ChromaDB / Pinecone) -->
    <rect x="350" y="20" width="140" height="110" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="420" y="60" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#ffffff">Vector DB</text>
    <text x="420" y="80" text-anchor="middle" font-family="monospace" font-size="11" fill="#c084fc">Cosine Similarity</text>
    <text x="420" y="100" text-anchor="middle" font-family="monospace" font-size="10" fill="#10b981">k=4 Relevant Docs</text>
  </g>

  <!-- Query & Response HUD -->
  <rect x="50" y="280" width="500" height="42" rx="10" fill="#0c1322" stroke="rgba(16, 185, 129, 0.3)"/>
  <text x="70" y="306" font-family="monospace" font-size="12" fill="#10b981">&gt; query("Análisis de riesgos"): Retrieval Augmented Generation OK (142ms)</text>

  <text x="30" y="45" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#ffffff">SENTINEL RAG ENGINE</text>
  <text x="30" y="65" font-family="monospace" font-size="12" fill="#10b981">LangChain Orchestration + Context Memory Retrieval</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Ring Shield -->
  <path d="M150 20 L260 60 C260 170 210 240 150 280 C90 240 40 170 40 60 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldEdge)" stroke-width="4" filter="url(#glowEffect)"/>

  <!-- Inner Inset Shield -->
  <path d="M150 35 L245 70 C245 165 200 225 150 262 C100 225 55 165 55 70 Z" 
        fill="#090f1d" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>

  <!-- Cisco Bridge Bars Wave -->
  <g fill="#38bdf8">
    <rect x="95" y="105" width="8" height="24" rx="4"/>
    <rect x="115" y="95" width="8" height="34" rx="4"/>
    <rect x="135" y="80" width="8" height="49" rx="4"/>
    <rect x="157" y="80" width="8" height="49" rx="4"/>
    <rect x="177" y="95" width="8" height="34" rx="4"/>
    <rect x="197" y="105" width="8" height="24" rx="4"/>
  </g>

  <!-- Typography -->
  <text x="150" y="170" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">
    CCNA
  </text>
  <text x="150" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="3">
    CISCO CERTIFIED
  </text>
  <text x="150" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">
    NETWORK ASSOCIATE
  </text>

  <!-- Verified Security Check Icon -->
  <circle cx="150" cy="242" r="11" fill="#10b981"/>
  <path d="M144 242 L148 246 L156 238" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

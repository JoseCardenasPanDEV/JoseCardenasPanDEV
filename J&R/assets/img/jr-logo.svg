<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#15233d"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="cobaltEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="silverText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#shieldGrad)"/>
  <rect width="396" height="396" x="2" y="2" rx="30" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Architectural Geometric Diamond / Shield -->
  <path d="M200 60 L320 140 L320 260 L200 340 L80 260 L80 140 Z" 
        fill="#0b1324" stroke="url(#cobaltEdge)" stroke-width="3.5" filter="url(#subtleGlow)"/>

  <!-- Inner Subtle Grid -->
  <path d="M200 60 L200 340 M80 140 L320 260 M80 260 L320 140" 
        stroke="rgba(56, 189, 248, 0.12)" stroke-width="1.5"/>

  <!-- Core Monogram J&R -->
  <text x="200" y="215" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="76" font-weight="900" fill="url(#silverText)" letter-spacing="-2">
    J&amp;R
  </text>
  <text x="200" y="248" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="6">
    SOLUTION
  </text>

  <!-- Accent Nodes -->
  <circle cx="200" cy="60" r="5" fill="#38bdf8"/>
  <circle cx="320" cy="140" r="5" fill="#2563eb"/>
  <circle cx="320" cy="260" r="5" fill="#38bdf8"/>
  <circle cx="200" cy="340" r="5" fill="#2563eb"/>
  <circle cx="80" cy="260" r="5" fill="#38bdf8"/>
  <circle cx="80" cy="140" r="5" fill="#2563eb"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0e1e2d"/>
      <stop offset="100%" stop-color="#07101c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#dbBg)"/>

  <!-- Database Cylinders -->
  <g transform="translate(60, 100)">
    <!-- PostgreSQL Column -->
    <rect x="0" y="30" width="120" height="120" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="60" cy="30" rx="60" ry="16" fill="#0284c7"/>
    <text x="60" y="80" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#ffffff">PostgreSQL</text>
    <text x="60" y="105" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">ACID Relational</text>
    <text x="60" y="125" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">JSONB + Index</text>

    <!-- MySQL Column -->
    <rect x="160" y="30" width="120" height="120" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="220" cy="30" rx="60" ry="16" fill="#d97706"/>
    <text x="220" y="80" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#ffffff">MySQL</text>
    <text x="220" y="105" text-anchor="middle" font-family="monospace" font-size="11" fill="#f59e0b">Replication Clust</text>
    <text x="220" y="125" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">InnoDB Engine</text>

    <!-- MongoDB Column -->
    <rect x="320" y="30" width="120" height="120" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="380" cy="30" rx="60" ry="16" fill="#059669"/>
    <text x="380" y="80" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="16" fill="#ffffff">MongoDB</text>
    <text x="380" y="105" text-anchor="middle" font-family="monospace" font-size="11" fill="#10b981">NoSQL BSON</text>
    <text x="380" y="125" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Distributed Shards</text>
  </g>

  <!-- Query Sync Pipeline indicator -->
  <rect x="60" y="270" width="480" height="38" rx="8" fill="#111827" stroke="rgba(255,255,255,0.1)"/>
  <text x="300" y="294" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8">⇄ Hybrid Query Router: Auto-Sharding &amp; Read/Write Replicas</text>

  <text x="30" y="45" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#ffffff">ENTERPRISE DATASYNC PLATFORM</text>
  <text x="30" y="65" font-family="monospace" font-size="12" fill="#10b981">High-Concurrency PostgreSQL, MySQL &amp; MongoDB Architecture</text>
</svg>
